<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Histórico das consultas do paciente no PsicNota">
  <title>PsicNota | Histórico das consultas</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/psicologo/historico.css">
  <script src="../assets/menu/menu.js"></script>
</head>

<body>

  <div class="app-shell">

    <psic-menu tipo="psicologo" ativo="pacientes"></psic-menu>

    <main class="main-content">

      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        ☰
      </button>

      <header class="topbar">
        <div class="page-heading">
          <p class="eyebrow">Histórico</p>
          <h1>Histórico das consultas</h1>
        </div>

        <div class="topbar-actions">
          <div class="patient-chip" id="patientChip" hidden>
            <span class="patient-chip-avatar" id="patientChipAvatar" aria-hidden="true"></span>
            <div>
              <strong id="patientChipName"></strong>
              <span>Paciente</span>
            </div>
          </div>

          <a class="button button-secondary button-compact" href="pacientes.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
            Meus pacientes
          </a>
        </div>
      </header>

      <!-- LISTA DE CONSULTAS -->
      <section class="history-card" id="historyCard" aria-labelledby="historyCardTitle">

        <div class="history-card-head">
          <h2 id="historyCardTitle">Consultas registradas</h2>
          <span class="history-count" id="historyCount"></span>
        </div>

        <div id="historyRows"></div>

        <nav class="history-pager" id="historyPager" aria-label="Paginação do histórico"></nav>

      </section>

      <!-- ESTADO VAZIO (variante -1 do design) -->
      <section class="history-empty" id="historyEmpty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Z" />
          <path d="M8 2v4m8-4v4M3 9h18" />
        </svg>
        <strong>Nenhuma consulta por aqui</strong>
        <p id="historyEmptyText">
          Quando houver consultas registradas para este paciente, elas aparecem nesta página em ordem cronológica.
        </p>
      </section>

    </main>

  </div>

  <script src="../assets/js/shared-data.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/psicologo/historico.js"></script>

</body>

</html>
