<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Agenda de consultas e solicitações do psicólogo no PsicNota" />
  <title>PsicNota | Agenda das Consultas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/psicologo/agenda-psicologo.css" />
  <link rel="stylesheet" href="../assets/menu/menu.css" />
  <script src="../assets/menu/menu.js"></script>
</head>

<body class="psic-view">
  <div class="app-shell">
    <psic-menu tipo="psicologo" ativo="agenda"></psic-menu>

    <main class="main-content agenda-psic-page">

      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>

      <header class="topbar agenda-topbar">
        <h1>Agenda das Consultas</h1>
      </header>

      <section class="agenda-content">

        <h2 class="agenda-subtitle">
          Escolha um dia e um horário para consultar
        </h2>

        <!-- =========================================================
             CARDS DE RESUMO
             ========================================================= -->

        <section class="psic-dashboard" aria-label="Resumo da agenda">

          <button class="psic-dashboard-card dashboard-week" id="weekAppointmentsCard" type="button">
            <span class="dashboard-copy">
              <small>Esta semana</small>
              <strong id="weekAppointmentsCount">
                0 atendimentos
              </strong>
            </span>

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>

          <button class="psic-dashboard-card dashboard-next" id="nextAppointmentCard" type="button">
            <span class="dashboard-copy">
              <small>Próximo atendimento</small>
              <strong id="nextAppointmentSummary">
                Nenhum agendamento
              </strong>
            </span>

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>

          <button class="psic-dashboard-card dashboard-pending" id="pendingRequestsCard" type="button">
            <span class="dashboard-copy">
              <small>Pedidos Pendentes</small>
              <strong id="pendingRequestsCount">
                0 solicitações
              </strong>
            </span>

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>

        </section>

        <!-- =========================================================
             CALENDÁRIO
             ========================================================= -->

        <section class="psic-calendar-card" aria-label="Calendário de consultas">
          <div class="psic-calendar-header">

            <div></div>

            <h2 id="psicMonthTitle">
              Mês
            </h2>

            <div class="psic-calendar-navigation">

              <button id="psicPreviousMonth" class="calendar-arrow" type="button" aria-label="Mês anterior">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m15 18-6-6 6-6"></path>
                </svg>
              </button>

              <button id="psicNextMonth" class="calendar-arrow" type="button" aria-label="Próximo mês">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"></path>
                </svg>
              </button>

            </div>

          </div>

          <div class="weekdays psic-weekdays" aria-hidden="true">
            <span>DOM</span>
            <span>SEG</span>
            <span>TER</span>
            <span>QUA</span>
            <span>QUI</span>
            <span>SEX</span>
            <span>SÁB</span>
          </div>

          <div class="calendar-grid psic-calendar-grid" id="psicCalendarGrid" role="grid"></div>
        </section>

        <!-- =========================================================
             POPUP DE HORÁRIOS DISPONÍVEIS (marcar consulta)
             ========================================================= -->

        <div class="psic-schedule-popup" id="psicSchedulePopup" role="dialog" aria-modal="true" aria-hidden="true"
          aria-labelledby="psicSchedulePopupDate">
          <div class="psic-schedule-popup-card">

            <button class="psic-schedule-popup-back" id="psicSchedulePopupClose" type="button" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>

            <div class="psic-schedule-popup-header">
              <span class="psic-schedule-popup-eyebrow">HORÁRIOS DISPONÍVEIS</span>
              <strong id="psicSchedulePopupDate">Data</strong>
            </div>

            <label class="psic-patient-field">
              <span class="sr-only">Paciente</span>
              <select id="psicPatientSelect" class="psic-patient-select">
                <option value="">Clique para escolher seu paciente</option>
              </select>
            </label>

            <div class="psic-schedule-popup-columns">

              <section class="psic-schedule-column" id="psicOnlineColumn">
                <div class="psic-schedule-column-pill">
                  Online
                </div>

                <div class="psic-schedule-times" id="psicOnlineTimes"></div>
              </section>

              <section class="psic-schedule-column" id="psicPresentialColumn">
                <div class="psic-schedule-column-pill">
                  Presencial
                </div>

                <div class="psic-schedule-times" id="psicPresentialTimes"></div>
              </section>

            </div>

            <label class="psic-schedule-terms">
              <input type="checkbox" id="psicScheduleTerms" />
              <span>Confirmo que li os Termos de Uso</span>
            </label>

            <button class="psic-schedule-submit" id="psicScheduleSubmit" type="button" disabled>
              Marcar consulta
            </button>

          </div>
        </div>

        <!-- =========================================================
             POPUP DE SOLICITAÇÕES (pedidos pendentes)
             ========================================================= -->

        <div class="psic-requests-popup" id="psicRequestsPopup" aria-hidden="true" role="dialog" aria-modal="true"
          aria-labelledby="psicRequestsPopupTitle">
          <div class="psic-requests-popup-card">

            <button class="psic-requests-popup-back" id="psicRequestsPopupClose" type="button" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>

            <header class="psic-requests-popup-header">
              <span>SOLICITAÇÕES</span>

              <strong id="psicRequestsPopupTitle">
                Pedidos pendentes
              </strong>
            </header>

            <div class="psic-requests-popup-list" id="psicRequestsPopupList"></div>

          </div>
        </div>

        <!-- =========================================================
             POPUP DE PRÓXIMAS CONSULTAS
             ========================================================= -->

        <div class="psic-appointments-popup" id="psicAppointmentsPopup" aria-hidden="true" role="dialog" aria-modal="true"
          aria-labelledby="psicAppointmentsPopupTitle">
          <div class="psic-appointments-popup-card">

            <button class="psic-appointments-popup-back" id="psicAppointmentsPopupClose" type="button" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>

            <header class="psic-appointments-popup-header">
              <span>PRÓX. CONSULTAS</span>

              <strong id="psicAppointmentsPopupTitle">
                Consultas agendadas
              </strong>
            </header>

            <div class="psic-appointments-popup-list" id="psicAppointmentsPopupList"></div>

          </div>
        </div>

        <!-- =========================================================
             POPUP DE CONSULTAS CONCLUÍDAS 7D
             ========================================================= -->

        <div class="psic-completed-popup" id="psicCompletedPopup" aria-hidden="true" role="dialog" aria-modal="true"
          aria-labelledby="psicCompletedPopupTitle">
          <div class="psic-completed-popup-card">

            <button class="psic-completed-popup-back" id="psicCompletedPopupClose" type="button" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>

            <header class="psic-completed-popup-header">
              <span>CONCLUIDAS 7D</span>

              <strong id="psicCompletedPopupTitle">
                Atendimentos recentes
              </strong>
            </header>

            <div class="psic-completed-popup-list" id="psicCompletedPopupList"></div>

          </div>
        </div>

      </section>

    </main>
  </div>

  <div class="toast" id="psicToast" role="status" aria-live="polite" hidden><span aria-hidden="true">✓</span><span id="psicToastMessage"></span></div>
  <script src="../assets/js/shared-data.js"></script>
  <script src="../assets/js/agenda-psicologo.js"></script>
</body>

</html>
