<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro de dias e horários disponíveis do psicólogo no PsicNota" />
  <title>PsicNota | Disponibilidade</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/psicologo/disponibilidades.css" />
  <link rel="stylesheet" href="../assets/menu/menu.css">
  <script src="../assets/menu/menu.js"></script>
</head>

<body>
  <div class="app-shell">
    <psic-menu tipo="psicologo" ativo="disponibilidades"></psic-menu>

    <main class="main-content">
      <header class="topbar">
        <div class="page-heading">
          <span class="page-heading-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="3" y="5" width="18" height="16" rx="2"></rect>
              <path d="M3 9h18M8 3v4M16 3v4"></path>
            </svg>
          </span>
          <div>
            <h1>Disponibilidade</h1>
            <p>Cadastre os dias e os horários em que você está disponível para atendimento.</p>
          </div>
        </div>
      </header>

      <div class="availability-layout">
        <div class="availability-main">
          <section class="surface add-card" aria-labelledby="addScheduleTitle">
            <h2 id="addScheduleTitle">Adicionar horário disponível</h2>

            <form class="schedule-form" id="scheduleForm">
              <label class="field">
                <span>Dia da semana</span>
                <select id="weekday" name="weekday">
                  <option value="1">Segunda-feira</option>
                  <option value="2">Terça-feira</option>
                  <option value="3">Quarta-feira</option>
                  <option value="4">Quinta-feira</option>
                  <option value="5">Sexta-feira</option>
                  <option value="6">Sábado</option>
                  <option value="0">Domingo</option>
                </select>
              </label>

              <label class="field">
                <span>Horário disponível</span>
                <input id="startTime" name="startTime" type="time" value="08:00" step="1200" required />
              </label>

              <label class="field">
                <span>Modalidade</span>
                <select id="modality" name="modality" required>
                  <option value="online">Online</option>
                  <option value="presencial">Presencial</option>
                </select>
              </label>

              <button class="primary-button" type="submit">Adicionar</button>
              <button class="outline-button" id="cancelScheduleEdit" type="button" hidden>Cancelar edição</button>
            </form>
            <p id="scheduleMessage" class="schedule-message" role="status" aria-live="polite" hidden></p>
          </section>

          <section class="surface schedules-card" aria-labelledby="registeredSchedulesTitle">
            <div class="card-header">
              <h2 id="registeredSchedulesTitle">Meus horários cadastrados</h2>
              <button class="outline-button" id="deleteSelected" type="button">Excluir selecionados</button>
            </div>

            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th class="check-column" scope="col">
                      <label class="check-control">
                        <input id="selectAll" type="checkbox" aria-label="Selecionar todos os horários" />
                        <span aria-hidden="true"></span>
                      </label>
                    </th>
                    <th scope="col">Dia da semana</th>
                    <th scope="col">Horário</th>
                    <th scope="col">Modalidade</th>
                    <th class="actions-heading" scope="col">Ações</th>
                  </tr>
                </thead>
                <tbody id="scheduleRows"></tbody>
              </table>
            </div>
          </section>
        </div>

        <aside class="surface week-summary" aria-labelledby="weekSummaryTitle">
          <h2 id="weekSummaryTitle">Resumo da semana</h2>
          <ul></ul>
        </aside>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/psicologo/disponibilidades.js"></script>
</body>

</html>
