<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Lista de pacientes do psicólogo no PsicNota."
  >

  <title>PsicNota · Meus pacientes</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Laila:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../assets/css/psicologo/pacientes.css?v=2"
  >

  <script src="../assets/menu/menu.js"></script>
</head>


<body>

  <div class="app-shell">

    <psic-menu
      tipo="psicologo"
      ativo="pacientes">
    </psic-menu>


    <main class="main-content">

      <button
        class="mobile-menu"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false">
        ☰
      </button>


      <section class="patients-page">

        <header class="patients-header">

          <h1>Pacientes</h1>
          <span id="patientTotal" class="patients-count">Carregando...</span>

        </header>


        <div
          id="patientList"
          class="patient-list"
          aria-live="polite"
          aria-busy="true">
        </div>

        <div id="loadingPatients" class="page-state" role="status">
          Carregando pacientes...
        </div>


        <div
          id="emptyPatients"
          class="page-state"
          hidden>
          Nenhum paciente cadastrado.
        </div>


        <div id="patientError" class="page-state page-state-error" role="alert" hidden>
          Não foi possível carregar os pacientes. Atualize a página e tente novamente.
        </div>


        <button
          id="loadMorePatients"
          class="load-more"
          type="button"
          hidden>
          Carregar mais
        </button>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/psicologo/pacientes.js?v=2"></script>

</body>

</html>
