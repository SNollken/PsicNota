<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Histórico de consultas do psicólogo no PsicNota" />
  <title>PsicNota | Histórico de consultas</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/psicologo/historico-consultas.css" />
  <link rel="stylesheet" href="../assets/menu/menu.css" />
  <script src="../assets/menu/menu.js"></script>
</head>

<body class="history-view">
  <div class="app-shell">
    <psic-menu tipo="psicologo" ativo="historico-consultas"></psic-menu>

    <main class="main-content history-page">
      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
      </button>

      <header class="history-header">
        <h1>Histórico de consultas</h1>
      </header>

      <section class="history-card" aria-labelledby="history-table-title">
        <h2 class="sr-only" id="history-table-title">Consultas realizadas</h2>

        <div class="table-scroll">
          <table>
            <caption class="sr-only">Histórico das consultas mais recentes</caption>
            <thead>
              <tr>
                <th scope="col">Data</th>
                <th scope="col">Paciente</th>
                <th scope="col">Tipo</th>
                <th scope="col">Duração</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
              </tr>
            </thead>
            <tbody id="appointmentsList">
            </tbody>
          </table>
        </div>

        <footer class="table-footer">
          <p id="histCount">Carregando…</p>
        </footer>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/profile-backend.js"></script>
  <script src="../assets/js/shared-data.js"></script>
  <script src="../assets/js/psicologo/historico-consultas.js"></script>
</body>

</html>
