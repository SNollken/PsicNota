<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Visualização de relatório pós-consulta do PsicNota" />
  <title>PsicNota | Visualização de relatório</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/psicologo/relatorio-view.css" />
  <link rel="stylesheet" href="../assets/menu/menu.css" />
  <script src="../assets/menu/menu.js"></script>
</head>

<body class="report-view-page">

  <div class="app-shell">

    <psic-menu tipo="psicologo" ativo="relatorios"></psic-menu>


    <main class="main-content">

      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        ☰
      </button>


      <header class="topbar report-view-topbar">

        <div class="page-heading">
          <p class="eyebrow">Relatório</p>
          <h1>Visualização de relatório</h1>
        </div>

        <div class="topbar-actions">
          <a class="button button-secondary button-compact" href="relatorios.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
            Voltar
          </a>

          <button class="button button-primary button-compact" id="printButton" type="button" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9V4h12v5" />
              <rect x="4" y="9" width="16" height="8" rx="2" />
              <path d="M8 17h8v4H8z" />
            </svg>
            Imprimir
          </button>
        </div>

      </header>


      <!-- RELATÓRIO NÃO ENCONTRADO -->
      <section class="panel not-found-card" id="notFound" hidden aria-labelledby="notFoundTitle">

        <h2 id="notFoundTitle">Relatório não encontrado</h2>

        <div class="notice-item notice-warning">
          <strong>Não foi possível abrir este relatório.</strong>
          O link está incompleto ou o relatório não existe mais.
        </div>

        <a class="button button-secondary" href="relatorios.html">
          Voltar para relatórios
        </a>

      </section>


      <!-- DOCUMENTO DO RELATÓRIO -->
      <article class="doc-card" id="reportDocument" hidden>

        <header class="doc-head">
          <div class="doc-head-main">
            <h2 class="doc-patient" id="docPatient"></h2>
            <p class="doc-meta" id="docMeta"></p>
            <p class="doc-mood" id="docMood" hidden></p>
          </div>

          <span class="badge badge-draft" id="docDraftBadge" hidden>Rascunho</span>
        </header>

        <div class="doc-blocks" id="docBlocks"></div>

      </article>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/profile-backend.js"></script>
<script src="../assets/js/shared-data.js"></script>
  <script src="../assets/js/psicologo/relatorio-view.js"></script>
</body>
</html>
