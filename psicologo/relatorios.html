<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Relatórios pós-consulta do PsicNota" />
  <title>PsicNota | Relatórios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/psicologo/relatorios.css" />
  <link rel="stylesheet" href="../assets/menu/menu.css" />
  <script src="../assets/menu/menu.js"></script>
</head>

<body class="report-editor-page">

  <div class="app-shell">

    <psic-menu tipo="psicologo" ativo="relatorios"></psic-menu>


    <main class="main-content">

      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        ☰
      </button>


      <header class="topbar report-editor-topbar">

        <div class="page-heading">
          <p class="eyebrow">Relatório</p>
          <h1 id="pageTitle">Relatórios</h1>
        </div>

        <div class="topbar-actions">
          <button class="button button-secondary button-compact" id="backToListButton" type="button" hidden>
            Voltar para a lista
          </button>
        </div>

      </header>


      <!-- LISTA DE RELATÓRIOS -->
      <div id="listView">

        <section class="panel" aria-labelledby="historyTitle">

          <div class="card-heading">

            <div>
              <p class="eyebrow">Histórico</p>
              <h2 id="historyTitle">Todos os relatórios</h2>
              <p>Mais recentes primeiro.</p>
            </div>

            <div class="action-row">

              <span class="badge badge-neutral" id="reportTotal">
                0 relatórios
              </span>

              <a class="button button-primary" id="newReportButton" href="relatorios.html?novo=1">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>

                Novo relatório
              </a>

            </div>

          </div>

          <div class="report-list" id="reportList"></div>

          <div class="notice-item notice-info" id="emptyReports" hidden>
            <strong>Nenhum relatório ainda.</strong>
            Crie um relatório a partir de uma consulta na agenda ou pelo botão acima.
          </div>

        </section>

      </div>


      <!-- EDITOR -->
      <div id="editorView" hidden>

        <form id="reportForm" novalidate>


          <!-- INFORMAÇÕES SUPERIORES -->
          <section class="report-editor-header">

            <div class="report-consultation">

              <span class="report-editor-label">
                Consulta
              </span>

              <div class="report-consultation-select">

                <span class="report-patient-avatar" id="reportPatientAvatar">
                  <span>PS</span>
                </span>

                <select id="reportAppointment"></select>

                <span class="report-select-arrow">
                  ↓
                </span>

              </div>

              <p class="report-context-note" id="editorContext"></p>

            </div>


            <div class="report-mood-section">



              <div class="mood-picker" id="moodPicker" role="radiogroup" aria-label="Emoção do dia">

                <button type="button" class="mood-option" role="radio" aria-checked="false" data-mood="muito-bem">
                  <span class="mood-emoji" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"></circle>

                      <circle cx="9" cy="10" r="1"></circle>
                      <circle cx="15" cy="10" r="1"></circle>

                      <path d="M8 14c1 3 7 3 8 0"></path>
                    </svg>
                  </span>
                  <span>Muito bem</span>
                </button>

                <button type="button" class="mood-option" role="radio" aria-checked="false" data-mood="bem">
                  <span class="mood-emoji" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"></circle>

                      <circle cx="9" cy="10" r="1"></circle>
                      <circle cx="15" cy="10" r="1"></circle>

                      <path d="M9 14c1.5 1.5 4.5 1.5 6 0"></path>
                    </svg>
                  </span>
                  <span>Bem</span>
                </button>

                <button type="button" class="mood-option" role="radio" aria-checked="false" data-mood="neutro">
                  <span class="mood-emoji" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"></circle>

                      <circle cx="9" cy="10" r="1"></circle>
                      <circle cx="15" cy="10" r="1"></circle>

                      <path d="M8.5 15h7"></path>
                    </svg>
                  </span>
                  <span>Estável</span>
                </button>

                <button type="button" class="mood-option" role="radio" aria-checked="false" data-mood="mal">
                  <span class="mood-emoji" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"></circle>

                      <path d="M8 10.5l2-.8"></path>
                      <path d="M16 10.5l-2-.8"></path>

                      <circle cx="9" cy="11" r="1"></circle>
                      <circle cx="15" cy="11" r="1"></circle>

                      <path d="M9 16c1.5-1.8 4.5-1.8 6 0"></path>
                    </svg>
                  </span>
                  <span>Mal</span>
                </button>

                <button type="button" class="mood-option" role="radio" aria-checked="false" data-mood="muito-mal">
                  <span class="mood-emoji" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9"></circle>

                      <path d="M7.5 9.5l2.5 1"></path>
                      <path d="M16.5 10.5l-2.5-1"></path>

                      <circle cx="9" cy="11" r="1"></circle>
                      <circle cx="15" cy="11" r="1"></circle>

                      <path d="M8 16.5c2-2.5 6-2.5 8 0"></path>
                    </svg>
                  </span>
                  <span>Muito mal</span>
                </button>

              </div>

            </div>

          </section>


          <!-- ÁREA PRINCIPAL DE ESCRITA -->
          <section class="report-writing-area">

            <div class="report-writing-inner">

              <textarea id="freeText" class="report-main-textarea" rows="1"
                placeholder="Digite suas anotações da sessão..." aria-label="Anotações da sessão"></textarea>

              <button class="report-microphone" type="button" aria-label="Gravar anotação por voz"
                title="Anotação por voz">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" />
                  <path d="M19 11a7 7 0 0 1-14 0M12 18v4M8 22h8" />
                </svg>
              </button>

            </div>

          </section>


          <!-- CAMPOS ANTIGOS MANTIDOS PARA COMPATIBILIDADE -->
          <div class="report-legacy-fields" aria-hidden="true">

            <input id="reportPatient" type="text" value="" />

            <div id="appointmentInfoGrid">

              <input id="reportInfoPatient" type="text" readonly />
              <input id="reportInfoDate" type="text" readonly />
              <input id="reportInfoTime" type="text" readonly />
              <input id="reportInfoDuration" type="text" readonly />
              <input id="reportInfoMode" type="text" readonly />

            </div>

            <textarea id="blockQueixa"></textarea>
            <textarea id="blockIntervencao"></textarea>
            <textarea id="blockEvolucao"></textarea>
            <textarea id="blockProxima"></textarea>

          </div>


          <!-- RODAPÉ -->
          <section class="report-editor-footer">

            <div class="report-attachments-area">

              <button class="report-attach-button" id="attachButton" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l8.57-8.57a4 4 0 1 1 5.66 5.66l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                </svg>

                <span>Anexar arquivo</span>
              </button>

              <input type="file" id="attachInput" multiple hidden />

              <div class="attach-chips" id="attachChips"></div>

              <p class="attach-note" id="attachNote">
                No protótipo, apenas o nome do arquivo é armazenado.
              </p>

            </div>


            <span class="draft-status" id="draftStatus"></span>


            <div class="report-save-actions">

              <button class="button button-secondary report-cancel-button" id="cancelEditButton" type="button">
                Cancelar
              </button>

              <button class="button button-secondary report-draft-button" id="saveDraftButton" type="button">
                Salvar como rascunho
              </button>

              <button class="button button-primary report-save-button" type="submit">
                Salvar relatório
              </button>

            </div>

          </section>




        </form>

      </div>

    </main>

  </div>


  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span aria-hidden="true">✓</span>
    <span id="toastMessage"></span>
  </div>


  <script src="../assets/js/shared-data.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/psicologo/relatorios.js"></script>

</body>

</html>
