<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PsicNota · Histórico de Notas</title>

  <link rel="stylesheet" href="../assets/css/psicologo/historico-notas.css">

  <script src="../assets/menu/menu.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <div class="app-shell">

    <psic-menu tipo="psicologo" ativo=""></psic-menu>


    <main class="main-content">

      <button
        class="mobile-menu"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false"
      >
        ☰
      </button>


      <!-- =========================
           TÍTULO
      ========================== -->

      <header class="page-title">

        <h1 id="patientTitle">
          PERFIL DE PACIENTE
        </h1>

      </header>


      <!-- =========================
           PERFIL DO PACIENTE
      ========================== -->

      <section class="patient-card">


        <div class="patient-info">

          <div class="patient-avatar">

            <img
              id="patientAvatar"
              src="../assets/img/avatar.png"
              class="patient-photo"
              alt="Foto do paciente"
            >

          </div>


          <div>

            <h2 id="patientName">
              Janaina Silva
            </h2>

            <p id="patientMeta">
              29 anos • Ela / Dela
            </p>

          </div>

        </div>



        <div class="patient-contact">

          <p>
            <i data-lucide="mail"></i>

            <span id="patientEmail">
              janaina@gmail.com
            </span>
          </p>


          <p>
            <i data-lucide="phone"></i>

            <span id="patientPhone">
              +55 (61) 99999 - 0000
            </span>
          </p>


          <p>
            <i data-lucide="map-pin"></i>

            <span id="patientLocation">
              Brasília, DF, Brasil
            </span>
          </p>

        </div>



        <div class="patient-actions">

          <button class="primary" id="quickNotesButton" type="button">
            Notas rápidas
          </button>

          <button class="outline" id="scheduleButton" type="button">
            Agendar consulta
          </button>

        </div>


      </section>


      <!-- =========================
           ABAS
      ========================== -->

      <nav class="patient-tabs">

        <a href="historico.html">
          Visão Geral
        </a>

        <a href="historico-consultas.html">
          Consultas
        </a>

        <a
          class="active"
          href="historico-notas.html"
        >
          Historico Notas
        </a>

        <a href="historico-relatorios.html">
          Relatórios
        </a>

        <a href="dados-completos.html">
          Dados completos
        </a>

      </nav>


      <!-- =========================
           HISTÓRICO DE NOTAS
      ========================== -->

      <section class="notes-history">

        <div
          id="notesHistoryList"
          class="notes-history-list"
        ></div>


        <div
          id="notesEmpty"
          class="notes-empty"
          hidden
        >
          <i data-lucide="message-square-off"></i>

          <p>
            Nenhuma nota rápida encontrada para este paciente.
          </p>
        </div>


        <div class="load-more-wrap">

          <button
            id="loadMoreButton"
            class="load-more-button"
            type="button"
            hidden
          >
            Carregar mais
          </button>

        </div>

      </section>


    </main>

  </div>


  <script src="../assets/js/shared-data.js"></script>
  <script src="../assets/js/seed-data.js"></script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/psicologo/historico-notas.js"></script>

</body>

</html>
