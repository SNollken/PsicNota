<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recuperação de senha do PsicNota (em construção).">
  <title>PsicNota | Esqueci minha senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <main class="auth-layout">
    <section class="auth-brand" aria-labelledby="brand-title">
      <a class="brand" href="home.html" aria-label="Página inicial do PsicNota">
        <img src="assets/img/logo_psicnota.png" alt="Ícone PsicNota" class="brand-icon" />
        <span class="brand-text">PsicNota</span>
      </a>

      <div class="brand-content">
        <p class="eyebrow">EM CONSTRUÇÃO</p>
        <h1 id="brand-title">Aqui será a página de recuperação de senha.</h1>
        <p>
          O design desta tela ainda não foi feito no Figma. Assim que estiver
          pronto, ela será implementada aqui.
        </p>
      </div>

      <p class="brand-footer">PsicNota · Organização para um atendimento mais humano.</p>
    </section>

    <section class="auth-panel" aria-labelledby="forgot-title">
      <div class="auth-panel-inner">
        <header class="auth-header">
          <p class="eyebrow">ENQUANTO ISSO</p>
          <h2 id="forgot-title">Volte para o login</h2>
        </header>

        <div class="home-actions">
          <a class="secondary-button" href="login.html">Voltar para o login</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
