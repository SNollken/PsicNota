<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Página inicial do paciente no PsicNota (em construção)" />
  <title>PsicNota | Início do paciente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css" />
</head>

<body class="patient-view">
  <div class="app-shell">
        <aside class="sidebar" aria-label="Navegação do paciente">

      <a class="brand" href="agenda-paciente.html" aria-label="PsicNota - página inicial">
        <img src="../assets/img/logo_psicnota.png" alt="Ícone PsicNota" class="brand-icon" />
        <span class="brand-text">PsicNota</span>
      </a>

      <nav class="main-nav">
        <p class="nav-label">MENU</p>

        <a class="nav-item" href="agenda-paciente.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Zm2-2v4m10-4v4M3 9h18"></path></svg>

          <span>Agendar consulta</span>
        </a>

        <a class="nav-item" href="laudos.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>

          <span>Receitas e Laudos</span>
        </a>
      </nav>

      <a class="sidebar-profile" href="../perfil.html" aria-label="Editar meu perfil">
        <span class="sidebar-profile-avatar" id="patientAvatar" aria-hidden="true">
          <img src="../assets/img/avatar-paciente.png" alt="" />
        </span>

        <span class="sidebar-profile-info">
          <strong id="patientNameTop">Paciente PsicNota</strong>
          <small>Paciente</small>
        </span>
      </a>

    </aside>

    <main class="main-content">

      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        ☰
      </button>

      <header class="topbar">
        <div class="page-heading"><p class="eyebrow">Em construção</p><h1>Aqui será a página inicial do paciente</h1></div>
      </header>

      <section class="panel">
        <p>O design desta tela ainda não foi feito no Figma. Assim que estiver pronto, ela será implementada aqui.</p>
      </section>
    </main>
  </div>

  <script src="../assets/js/shared-data.js"></script>
  <script>
    (function () {
      const data = window.PsiNoteData;
      const sidebar = document.querySelector(".sidebar");
      const mobileMenu = document.querySelector(".mobile-menu");

      mobileMenu?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        mobileMenu.setAttribute("aria-expanded", String(isOpen));
      });
      document.addEventListener("click", (event) => {
        if (window.innerWidth <= 720 && !sidebar.contains(event.target) && !mobileMenu.contains(event.target)) {
          sidebar.classList.remove("open");
          mobileMenu.setAttribute("aria-expanded", "false");
        }
      });

      if (data) {
        const session = data.getSession();
        if (session) {
          const displayName = session.fullName || session.name || "Paciente PsicNota";
          const nameEl = document.querySelector("#patientNameTop");
          const avatarEl = document.querySelector("#patientAvatar");
          if (nameEl) nameEl.textContent = displayName;
          if (avatarEl && session.avatarDataUrl) {
            const img = avatarEl.querySelector("img");
            if (img) img.src = session.avatarDataUrl;
            avatarEl.classList.add("has-photo");
          }
        }
      }
    })();
  </script>
</body>

</html>
