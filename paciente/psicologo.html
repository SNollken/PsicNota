<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Perfil público do psicólogo para o paciente (em construção)" />
  <title>PsicNota | Meu psicólogo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css" />
  <script src="../assets/menu/menu.js"></script>
</head>

<body class="patient-view">
  <div class="app-shell">
<psic-menu tipo="paciente" ativo=""></psic-menu>

    <main class="main-content">

      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        ☰
      </button>

      <header class="topbar">
        <div class="page-heading"><p class="eyebrow">Em construção</p><h1>Aqui será a página com o perfil do seu psicólogo</h1></div>
      </header>

      <section class="panel">
        <p>O design desta tela ainda não foi feito no Figma. Assim que estiver pronto, ela será implementada aqui.</p>
      </section>
    </main>
  </div>
  <script src="../assets/js/shared-data.js"></script>
  <script>
    (function () {
      const data = window.PsiNoteData;
      const sidebar = document.querySelector(".sidebar");
      const mobileMenu = document.querySelector(".mobile-menu");
      const logoutLink = document.querySelector("#logoutLink");

      logoutLink?.addEventListener("click", () => data && data.clearSession());

      mobileMenu?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        mobileMenu.setAttribute("aria-expanded", String(isOpen));
      });

      document.addEventListener("click", (event) => {
        if (window.innerWidth <= 720 && !sidebar.contains(event.target) && !mobileMenu.contains(event.target)) {
          sidebar.classList.remove("open");
          mobileMenu.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>

</html>
