<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Receitas e laudos disponibilizados pelo psicólogo (em construção)" />
  <title>PsicNota | Receitas e Laudos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css" />
</head>

<body class="patient-view">
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação do paciente">

      <a class="brand" href="home.html" aria-label="PsicNota - página inicial">
        <img src="../assets/img/logo_psicnota.png" alt="Ícone PsicNota" class="brand-icon" />
        <span class="brand-text">PsicNota</span>
      </a>

      <nav class="main-nav">
        <p class="nav-label">MENU</p>

        <a class="nav-item" href="home.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11 12 4l8 7v9h-5v-6h-6v6H4v-9Z"></path>
          </svg>

          <span>Início</span>
        </a>

        <a class="nav-item" href="agenda-paciente.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Zm2-2v4m10-4v4M3 9h18"></path>
          </svg>

          <span>Agendar consulta</span>
        </a>

        <a class="nav-item active" href="laudos.html" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 4h8l4 4v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4Zm8 0v4h4M9 13h6M9 17h4"></path>
          </svg>

          <span>Receitas e Laudos</span>
        </a>
      </nav>

      <a class="sidebar-profile" href="../perfil.html" aria-label="Editar meu perfil">
        <span class="sidebar-profile-avatar" aria-hidden="true">
          PN
        </span>

        <span class="sidebar-profile-info">
          <strong>Paciente PsicNota</strong>
          <small>Paciente</small>
        </span>
      </a>

    </aside>

    <main class="main-content">

      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">
        ☰
      </button>

      <header class="topbar">
        <div class="page-heading"><p class="eyebrow">Em construção</p><h1>Aqui será a página de receitas e laudos</h1></div>
      </header>

      <section class="panel">
        <p>O design desta tela ainda não foi feito no Figma. Assim que estiver pronto, ela será implementada aqui.</p>
      </section>
    </main>
  </div>

  <script src="../assets/js/shared-data.js"></script>
  <script>
    (function () {
      const data = window.PsiNoteData;
      const sidebar = document.querySelector(".sidebar");
      const mobileMenu = document.querySelector(".mobile-menu");
      const logoutLink = document.querySelector("#logoutLink");

      logoutLink?.addEventListener("click", () => data && data.clearSession());

      mobileMenu?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        mobileMenu.setAttribute("aria-expanded", String(isOpen));
      });

      document.addEventListener("click", (event) => {
        if (window.innerWidth <= 720 && !sidebar.contains(event.target) && !mobileMenu.contains(event.target)) {
          sidebar.classList.remove("open");
          mobileMenu.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>

</html>
