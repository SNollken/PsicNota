<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Página inicial do psicólogo no PsicNota (em construção)" />
  <title>PsicNota | Início do psicólogo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css" />
</head>
<body>
  <div class="app-shell">
        <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="agenda.html" aria-label="PsicNota - pág...cial">
        <img src="../assets/img/logo_psicnota.png" alt="Ícone PsicNota" class="brand-icon" />
        <span class="brand-text">PsicNota</span>
      </a>
      <nav class="main-nav">
        <p class="nav-label">MENU</p>
        <a class="nav-item" href="agenda.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Zm2-2v4m10-4v4M3 9h18"/></svg>
          Agendar consulta
        </a>
        <a class="nav-item" href="relatorios.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          Relatórios
        </a>
      </nav>

      <a class="sidebar-profile" href="../perfil.html" aria-label="Editar meu perfil">
        <span class="sidebar-profile-avatar" id="psychologistAvatar" aria-hidden="true"><img src="../assets/img/avatar-psicologo.png" alt="" /></span>
        <span class="sidebar-profile-info">
          <strong id="psychologistName">Psicólogo</strong>
          <small>Psicólogo</small>
        </span>
      </a>
      <div class="sidebar-footer"><a class="nav-item nav-logout" id="logoutLink" href="../login.html">Sair da conta</a></div>
    </aside>

    <main class="main-content">
      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>

      <header class="topbar">
        <div class="page-heading"><p class="eyebrow">Em construção</p><h1>Aqui será a página inicial do psicólogo</h1></div>
      </header>

      <section class="panel">
        <p>O design desta tela ainda não foi feito no Figma. Assim que estiver pronto, ela será implementada aqui.</p>
      </section>
    </main>
  </div>

  <script src="../assets/js/shared-data.js"></script>
  <script>
    (function () {
      const data = window.PsiNoteData;
      const sidebar = document.querySelector(".sidebar");
      const mobileMenu = document.querySelector(".mobile-menu");

      mobileMenu?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        mobileMenu.setAttribute("aria-expanded", String(isOpen));
      });
      document.addEventListener("click", (event) => {
        if (window.innerWidth <= 720 && !sidebar.contains(event.target) && !mobileMenu.contains(event.target)) {
          sidebar.classList.remove("open");
          mobileMenu.setAttribute("aria-expanded", "false");
        }
      });

      if (data) {
        const session = data.getSession();
        if (session) {
          const displayName = session.fullName || session.name || "Psicólogo";
          const nameEl = document.querySelector("#profileName");
          const avatarEl = document.querySelector("#profileAvatar");
          if (nameEl) nameEl.textContent = displayName;
          if (avatarEl) {
            const initials = displayName.split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
            avatarEl.textContent = initials;
            if (session.avatarDataUrl) {
              avatarEl.classList.add("has-photo");
              avatarEl.style.backgroundImage = 'url("' + session.avatarDataUrl + '")';
            }
          }
        }
      }
    })();
  </script>
</body>
</html>
