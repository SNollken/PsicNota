<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Página inicial do psicólogo no PsicNota (em construção)" />
  <title>PsicNota | Início do psicólogo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Laila:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/base.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="home.html" aria-label="PsicNota - página inicial">
        <img src="../assets/img/logo_psicnota.png" alt="Ícone PsicNota" class="brand-icon" />
        <span class="brand-text">PsicNota</span>
      </a>
      <nav class="main-nav">
        <p class="nav-label">MENU</p>
        <a class="nav-item active" href="home.html" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v9h-5v-6h-6v6H4v-9Z"/></svg>
          Início
        </a>
        <a class="nav-item" href="agenda.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Zm2-2v4m10-4v4M3 9h18M7 13h2m3 0h2m3 0h2M7 17h2m3 0h2"/></svg>
          Agenda
        </a>
        <a class="nav-item" href="pacientes.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 19a4 4 0 0 0-8 0M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7 8a3 3 0 0 0-3-3m-8 3a3 3 0 0 1 3-3"/></svg>
          Pacientes
        </a>
        <a class="nav-item" href="relatorios.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8l4 4v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4Zm8 0v4h4M9 13h6M9 17h4"/></svg>
          Relatórios
        </a>
        <p class="nav-label nav-label-spaced">CONTA</p>
        <a class="nav-item" href="../perfil.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0"/></svg>
          Meu perfil
        </a>
      </nav>
      <div class="sidebar-footer"><a class="nav-item nav-logout" id="logoutLink" href="../login.html">Sair da conta</a></div>
    </aside>

    <main class="main-content">
      <button class="mobile-menu" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>

      <header class="topbar">
        <div class="page-heading"><p class="eyebrow">Em construção</p><h1>Aqui será a página inicial do psicólogo</h1></div>
      </header>

      <section class="panel">
        <p>O design desta tela ainda não foi feito no Figma. Assim que estiver pronto, ela será implementada aqui.</p>
      </section>
    </main>
  </div>

  <script src="../assets/js/shared-data.js"></script>
  <script>
    (function () {
      const data = window.PsiNoteData;
      const sidebar = document.querySelector(".sidebar");
      const mobileMenu = document.querySelector(".mobile-menu");
      const logoutLink = document.querySelector("#logoutLink");

      logoutLink?.addEventListener("click", () => data && data.clearSession());

      mobileMenu?.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");
        mobileMenu.setAttribute("aria-expanded", String(isOpen));
      });

      document.addEventListener("click", (event) => {
        if (window.innerWidth <= 720 && !sidebar.contains(event.target) && !mobileMenu.contains(event.target)) {
          sidebar.classList.remove("open");
          mobileMenu.setAttribute("aria-expanded", "false");
        }
      });
    })();
  </script>
</body>
</html>
